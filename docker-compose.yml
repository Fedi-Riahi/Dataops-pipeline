x-app: &app
  build: .
  env_file: .env
  environment:
    PREFECT_API_URL: http://prefect-server:4200/api
  volumes:
    - warehouse:/data

services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333
    ports: ["8333:8333"]
    volumes: [seaweed-data:/data]

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports: ["4200:4200"]
    volumes: [prefect-data:/root/.prefect]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  pipeline:
    <<: *app
    command: python -m orchestration.flows
    depends_on:
      prefect-server: {condition: service_healthy}
      seaweedfs: {condition: service_started}

  dashboard:
    build: .
    env_file: .env
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    volumes:
      - warehouse:/data:ro

volumes:
  seaweed-data:
  prefect-data:
  warehouse: